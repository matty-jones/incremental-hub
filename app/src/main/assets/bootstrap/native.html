<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Hub Bootstrap</title>
  <style>
    body { font-family: system-ui, sans-serif; padding: 1rem; background: #f5f5f5; }
    h1 { font-size: 1.25rem; color: #1a1a1a; }
    .status { margin: 0.75rem 0; padding: 0.5rem 0.75rem; border-radius: 6px; }
    .status.ok { background: #d1fae5; color: #065f46; }
    .status.err { background: #fee2e2; color: #7f1d1d; }
    .status.info { background: #dbeafe; color: #1e3a5f; }
    pre { background: #fff; border: 1px solid #e5e7eb; border-radius: 6px; padding: 0.75rem; font-size: 0.8rem; overflow-x: auto; max-height: 300px; overflow-y: auto; }
    .section { margin-top: 1rem; }
    .section-title { font-weight: 600; font-size: 0.875rem; color: #374151; margin-bottom: 0.25rem; }
  </style>
</head>
<body>
  <h1>Hub Bootstrap</h1>
  <div id="status" class="status info">Loading…</div>

  <div class="section">
    <div class="section-title">localStorage Keys</div>
    <pre id="keys">—</pre>
  </div>

  <div class="section">
    <div class="section-title">localStorage Entries</div>
    <pre id="entries">—</pre>
  </div>

  <div class="section">
    <div class="section-title">Snapshot Envelope</div>
    <pre id="envelope">—</pre>
  </div>

  <script>
    (function () {
      var statusEl  = document.getElementById('status');
      var keysEl    = document.getElementById('keys');
      var entriesEl = document.getElementById('entries');
      var envelopeEl = document.getElementById('envelope');

      try {
        var keys    = Object.keys(localStorage);
        var entries = JSON.stringify(localStorage);
        var snapshot = {
          keys:       keys,
          entryCount: keys.length,
          timestamp:  Date.now()
        };

        keysEl.textContent    = JSON.stringify(keys, null, 2);
        entriesEl.textContent = entries;
        envelopeEl.textContent = JSON.stringify(snapshot, null, 2);

        if (typeof window !== 'undefined' && window.webkit && window.webkit.messageHandlers && window.webkit.messageHandlers.hub) {
          window.webkit.messageHandlers.hub.postMessage(snapshot);
          statusEl.className = 'status ok';
          statusEl.textContent = 'OK — message posted to native side';
        } else {
          statusEl.className = 'status err';
          statusEl.textContent = 'ERR — no webkit.messageHandlers.hub bridge found';
        }
      } catch (e) {
        statusEl.className = 'status err';
        statusEl.textContent = 'ERR — ' + e.message;
      }
    })();
  </script>
</body>
</html>
